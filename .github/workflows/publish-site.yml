name: Publish Custodian Systems

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/publish-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out public site
        uses: actions/checkout@v4
      - name: Configure and enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare public artifact
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
      - name: Upload public artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
